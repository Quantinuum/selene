[package]
name = "selene-formats"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Selene formats for Rust"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["quantum", "trace", "serialization"]
categories = ["encoding", "science"]

[lib]
name = "selene_formats"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
rmp-serde = "1.3"
rmpv = "1.3"
