[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-formats"
version = "0.1.1"
description = "Selene formats for Python"
readme = "python/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pydantic~=2.12", "msgpack>=1.1,<2"]
authors = [
  { name = "Quantinuum" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
repository = "https://github.com/quantinuum/selene"

[dependency-groups]
test = ["jsonschema>=4.23", "pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["python/selene_formats"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/trace/0.1.0.schema.json" = "selene_formats/schemas/trace/0.1.0.schema.json"
"schemas/trace/legacy.schema.json" = "selene_formats/schemas/trace/legacy.schema.json"

[tool.hatch.build.targets.sdist.force-include]
"schemas/trace/0.1.0.schema.json" = "schemas/trace/0.1.0.schema.json"
"schemas/trace/legacy.schema.json" = "schemas/trace/legacy.schema.json"
