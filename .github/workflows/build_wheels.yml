name: Build wheels Release

on:
  pull_request:
    branches:
      - main
      - 0.3-series
  push:
    branches:
      - main
      - 0.3-series
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CACHE_CARGO: true
jobs:
  build_selene_core:
    runs-on: ubuntu-latest
    outputs:
      wheel-ready: ${{ steps.upload_selene_core.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache selene-core wheel
        id: selene_core_wheel_cache
        uses: actions/cache@v5
        with:
          path: wheelhouse/selene_core-*.whl
          key: selene-core-wheel-cache-${{ hashFiles('selene-core/**') }}

      ##################################################################
      #
      # If no cache hit, build selene-core...
      #
      - uses: actions/cache@v5
        if: steps.selene_core_wheel_cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/
            target/
          key: selene-core-ci

      - name: "Set up Python"
        if: steps.selene_core_wheel_cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install rust toolchain
        if: steps.selene_core_wheel_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build selene-core wheel
        if: steps.selene_core_wheel_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p wheelhouse
          python -m pip install --upgrade build
          python -m build --wheel --outdir wheelhouse selene-core
      #
      #################################################################

      - name: Upload selene-core wheel
        id: upload_selene_core
        uses: actions/upload-artifact@v7
        with:
          name: selene-core
          path: wheelhouse/selene_core-*.whl
          if-no-files-found: error

  build_selene_sim:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - macos-15-intel
          - windows-2022
    name: "Selene wheels (${{matrix.os}})"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up UV
        if: ${{ matrix.os != 'ubuntu-latest' }}
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Read Rust toolchain
        if: ${{ startsWith(matrix.os, 'macos-') }}
        id: rust_toolchain
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel = / { print $2 }' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install rust toolchain
        if: ${{ startsWith(matrix.os, 'macos-') }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

        #TODO: re-enable
        #- name: Prepare cache dir (linux)
        #  if: ${{ matrix.os == 'ubuntu-latest' }}
        #  run: |
        #    mkdir /tmp/ci-cache
        #    chmod 755 /tmp/ci-cache

      - uses: quantinuum/hugrverse-env/install-hugrenv-action@main
        with:
          packages: "llvm"
          target: ${{ startsWith(matrix.os, 'windows-') && 'win_mingw_amd64' || '' }}

      - name: Install matching MinGW compiler
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: pwsh
        run: |
          $toolchain = (Get-Content selene-toolchain/vendor/windows-sources.json -Raw | ConvertFrom-Json).distribution
          $archive = Join-Path $env:RUNNER_TEMP $toolchain.archive
          $destination = Join-Path $env:RUNNER_TEMP 'selene-mingw'
          Invoke-WebRequest -Uri $toolchain.url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $toolchain.sha256) { throw 'The MinGW compiler checksum does not match its pin' }
          & 7z x $archive "-o$destination" -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract the MinGW compiler' }
          $mingwRoot = Join-Path $destination 'mingw64'
          "MINGW_ROOT=$($mingwRoot.Replace('\', '/'))" >> $env:GITHUB_ENV
          "$mingwRoot\bin" >> $env:GITHUB_PATH

      - name: Remove hugrenv clang from PATH on Windows
        # We add hugrenv to provide LLVM tools for selene-toolchain.
        # However, on Windows, this has the side effect of adding clang
        # into the build environment in which e.g. stim is built, instead
        # of the default compiler, and the build fails.
        #
        # TODO: investigate why that build fails.
        #
        # For now we just remove the bundled clang from the path.
        if: ${{ startsWith(matrix.os, 'windows-') }}
        shell: pwsh
        run: |
          $hugrBin = 'C:\hugrverse\bin'
          $parts = $env:PATH -split ';' | Where-Object { $_ -and ($_ -ne $hugrBin) }
          $env:PATH = ($parts -join ';')
          "PATH=$($env:PATH)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # --------------------------------
      # Build selene-sim wheel
      # --------------------------------
      # If selene-core has changed, we will likely want to rebuild and test
      # selene-sim. If selene-sim has changed, we will want to rebuild and tests
      # selene-sim. As such, no wheel caching here.
      #
      # A later change may be to consider guppy->hugr->QIS->selene tests as
      # integration tests performed outside of the CIBuildWheel environment.
      # We can then just run "pure selene" tests, whatever they may look like,
      # within CIBuildWheel, and avoid rebuilding. For the time being,
      # guppy->hugr->QIS->selene tests are core to our selene testing strategy,
      # and are performed within CIBuildWheel to ensure that the tests succeed
      # on all compatible platforms.
      # --------------------------------

      # Cache the rust build intermediates
      - uses: actions/cache@v5
        # TODO: re-enable ubuntu-latest caching
        if: ${{ matrix.os != 'ubuntu-latest' }}
        with:
          path: |
            /tmp/ci-cache/selene
            target/
          key: selene-sim--build-env--cache--${{ matrix.os }}--${{ hashFiles('hugrenv.lock') }}--${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            selene-sim--build-env--cache--${{ matrix.os }}--${{ hashFiles('hugrenv.lock') }}--

      - name: Configure wheel paths
        shell: bash
        run: |
          echo "SELENE_TOOLCHAIN_WHEEL_DIR=$GITHUB_WORKSPACE/wheelhouse" >> "$GITHUB_ENV"
          echo "SELENE_TOOLCHAIN_SOURCE_DIR=$GITHUB_WORKSPACE/selene-toolchain/source-bundles" >> "$GITHUB_ENV"

      - name: Build selene-toolchain wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: selene-toolchain
          config-file: selene-toolchain/pyproject.toml

      # Perform the selene-sim build
      - name: Build selene-sim wheels
        uses: pypa/cibuildwheel@v3.4.1

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: selene-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload runtime sources
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-sources-${{ matrix.os }}
          path: selene-toolchain/source-bundles/*
          if-no-files-found: error

  test_install:
    needs:
      - build_selene_core
      - build_selene_sim
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-14
          - macos-15-intel
          - windows-2022
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          # TODO: enable when https://github.com/yaml/pyyaml/issues/951 is closed
          # and a python3.15-compatible pyyaml release is available on pypi.
          # - '3.15'
    name: "Install Selene (Python ${{ matrix.python-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Download selene-core wheel
        uses: actions/download-artifact@v8
        with:
          name: selene-core
          path: wheelhouse

      - name: Download selene-sim and selene-toolchain wheels
        uses: actions/download-artifact@v8
        with:
          name: selene-wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Install wheels and check dependencies
        # Install all three packages from this run so the toolchain and
        # selene-core changes are exercised by the installed-wheel tests.
        # If a dependency doesn't have a compatible wheel, we should fail here
        # rather than building it from source in the install test.
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl pytest
          python -m pip check

      - name: Smoke test installed Selene
        # Run outside the checkout so imports come from the installed wheels.
        # test_flip_some uses checked-in LLVM IR and exercises Quest, Stim,
        # Coinflip and ClassicalReplay without needing Guppy or pytket installed.
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest \
            "$GITHUB_WORKSPACE/selene-sim/python/tests/test_guppy.py::test_flip_some" \
            "$GITHUB_WORKSPACE/selene-sim/python/tests/test_process.py"

  release:
    strategy:
      matrix:
        target:
          - name: selene-core
            upload: wheelhouse/selene_core-*.whl
          - name: selene-sim
            upload: wheelhouse/selene_sim-*.whl
          - name: selene-toolchain
            upload: wheelhouse/selene_toolchain-*.whl
            sources: |
              wheelhouse/*.src.rpm
              wheelhouse/linux-*.json
    name: Release ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    # always do a full build and test before release of any package
    needs:
      - build_selene_core
      - build_selene_sim
      - test_install
    permissions:
      contents: write
      id-token: write
    steps:
      # note: we can't use if: on the entire job, as if statements are evaluated
      # before matrix expansion, so we follow the convention of guppylang and
      # use a step to check if we should run the release job
      - name: Check tag
        id: check-tag
        run: |
          echo "run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
        env:
          SHOULD_RUN: ${{ github.ref_type == 'tag' && startsWith(github.ref, format('refs/tags/{0}-v', matrix.target.name)) }}

      - uses: actions/download-artifact@v8
        if: ${{ steps.check-tag.outputs.run == 'true' }}
        with:
          path: wheelhouse
          merge-multiple: true

      - name: Check runtime source assets
        if: ${{ steps.check-tag.outputs.run == 'true' && matrix.target.name == 'selene-toolchain' }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("wheelhouse")
          manifests = list(root.glob("linux-*.json"))
          assert {path.stem for path in manifests} == {"linux-x86_64", "linux-aarch64"}
          for path in manifests:
              for name, entry in json.loads(path.read_text())["sources"].items():
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == entry["sha256"], name
          PY

      - name: GH Release
        if: ${{ steps.check-tag.outputs.run == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.target.upload }}
            ${{ matrix.target.sources }}
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Setup Python
        if: ${{ steps.check-tag.outputs.run == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install twine
        if: ${{ steps.check-tag.outputs.run == 'true' }}
        run: python -m pip install twine

      - name: Upload to pypi
        if: ${{ steps.check-tag.outputs.run == 'true' }}
        run: |
          twine upload --verbose --non-interactive ${{ matrix.target.upload }}
