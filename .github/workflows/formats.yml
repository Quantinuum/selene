name: Formats packages

on:
  pull_request:
    paths:
      - ".github/workflows/formats.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "selene-formats/**"
      - "uv.lock"
  push:
    branches:
      - main
      - 0.3-series
    tags:
      - "selene-formats-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Test
        run: uv run --locked --package selene-formats --group test pytest selene-formats/python/tests
      - name: Build distributions
        run: uv build --package selene-formats --out-dir dist/python
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: selene-formats-python
          path: dist/python/*
          if-no-files-found: error

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --package selene-formats
      - name: Package
        run: cargo package --allow-dirty --package selene-formats
      - name: Test packaged crate
        run: |
          package_dir="$(mktemp -d)"
          tar -xzf target/package/selene-formats-*.crate -C "$package_dir"
          cargo test --manifest-path "$package_dir"/selene-formats-*/Cargo.toml

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --dir selene-formats/typescript test
      - name: Prepare package directory
        run: mkdir -p dist/typescript
      - name: Package
        run: pnpm --dir selene-formats/typescript pack --pack-destination "$GITHUB_WORKSPACE/dist/typescript"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: selene-formats-typescript
          path: dist/typescript/*
          if-no-files-found: error

  verify-release-version:
    name: Verify shared release version
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'selene-formats-v')
    needs: [python, rust, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check package versions match the tag
        run: |
          expected_version="${GITHUB_REF_NAME#selene-formats-v}"
          package_version="$(python3 selene-formats/scripts/check_package_versions.py)"
          if [ "$package_version" != "$expected_version" ]; then
            echo "Release tag requires version $expected_version in every Formats package; found $package_version" >&2
            exit 1
          fi

  publish-python:
    name: Publish Python package
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'selene-formats-v')
    needs: [verify-release-version]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: selene-formats-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-rust:
    name: Publish Rust crate
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'selene-formats-v')
    needs: [verify-release-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --package selene-formats
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-typescript:
    name: Publish TypeScript package
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'selene-formats-v')
    needs: [verify-release-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up npm publishing
        run: npm install --global npm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish
        working-directory: selene-formats/typescript
        run: npm publish --access public
