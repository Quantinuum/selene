name: Publish JSON Schemas

on:
  pull_request:
    paths:
      - ".github/workflows/publish_schemas.yml"
      - "selene-protocol/schemas/**"
  push:
    branches:
      - 0.3-series
      - 1.0-series
      - main
    paths:
      - ".github/workflows/publish_schemas.yml"
      - "selene-protocol/schemas/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check published schemas are immutable
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 selene-protocol/scripts/check_schema_immutability.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
      - name: Validate and stage schemas
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path("selene-protocol/schemas")
          destination = Path("_site/schemas")
          base_url = "https://quantinuum.github.io/selene/schemas/"
          schemas = sorted(source.rglob("*.schema.json"))

          if not schemas:
              raise SystemExit(f"No JSON Schemas found under {source}")

          for schema in schemas:
              relative_path = schema.relative_to(source)
              expected_id = base_url + relative_path.as_posix()
              document = json.loads(schema.read_text())

              if document.get("$id") != expected_id:
                  raise SystemExit(
                      f"{schema}: expected $id {expected_id!r}, "
                      f"found {document.get('$id')!r}"
                  )

              output = destination / relative_path
              output.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(schema, output)
          PY
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/0.3-series'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/0.3-series'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
