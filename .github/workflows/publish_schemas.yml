name: Publish JSON Schemas

on:
  pull_request:
    paths:
      - ".github/workflows/publish_schemas.yml"
      - "selene-protocol/schemas/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish_schemas.yml"
      - "selene-protocol/schemas/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check published schemas are immutable
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def schema_paths_at(revision):
              result = subprocess.run(
                  [
                      "git",
                      "ls-tree",
                      "-r",
                      "--name-only",
                      revision,
                      "--",
                      "selene-protocol/schemas",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return {
                  path
                  for path in result.stdout.splitlines()
                  if path.endswith(".schema.json")
              }

          base_schemas = schema_paths_at(os.environ["BASE_SHA"])
          head_schemas = schema_paths_at(os.environ["HEAD_SHA"])
          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-status",
                  "--find-renames",
                  os.environ["BASE_SHA"],
                  os.environ["HEAD_SHA"],
                  "--",
                  "selene-protocol/schemas",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          violations = []
          for line in result.stdout.splitlines():
              status, *paths = line.split("\t")
              if status != "A" and any(path.endswith(".schema.json") for path in paths):
                  violations.append(line)

          if base_schemas:
              print(f"Previously published schemas ({len(base_schemas)}):")
              for schema in sorted(base_schemas):
                  print(f"  - {schema}")
          else:
              print("No previously published schemas were found.")

          new_schemas = sorted(head_schemas - base_schemas)
          if new_schemas:
              print(f"New schemas ({len(new_schemas)}):")
              for schema in new_schemas:
                  print(f"  - {schema}")
          else:
              print("No new schemas were found.")

          if violations:
              details = "\n".join(f"  {violation}" for violation in violations)
              raise SystemExit(
                  "Published JSON Schemas are immutable. Add a schema with a new "
                  f"versioned filename instead of changing an existing one:\n{details}"
              )

          if base_schemas:
              print("All previously published schemas are unchanged.")
          print("Schema immutability check passed.")
          PY
      - name: Validate and stage schemas
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path("selene-protocol/schemas")
          destination = Path("_site/schemas")
          base_url = "https://quantinuum.github.io/selene/schemas/"
          schemas = sorted(source.rglob("*.schema.json"))

          if not schemas:
              raise SystemExit(f"No JSON Schemas found under {source}")

          for schema in schemas:
              relative_path = schema.relative_to(source)
              expected_id = base_url + relative_path.as_posix()
              document = json.loads(schema.read_text())

              if document.get("$id") != expected_id:
                  raise SystemExit(
                      f"{schema}: expected $id {expected_id!r}, "
                      f"found {document.get('$id')!r}"
                  )

              output = destination / relative_path
              output.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(schema, output)
          PY
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
