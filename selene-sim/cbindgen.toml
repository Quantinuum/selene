# This is a template cbindgen.toml file with all of the default values.
# Some values are commented out because their absence is the real default.
#
# See https://github.com/mozilla/cbindgen/blob/master/docs.md#cbindgentoml
# for detailed documentation of every option here.



language = "C"



############## Options for Wrapping the Contents of the Header #################

# header = "/* Text to put at the beginning of the generated file. Probably a license. */"
# trailer = "/* Text to put at the end of the generated file */"
include_guard = "SELENE_SIM_H"
# pragma_once = true
# autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = false
# namespace = "my_namespace"
namespaces = []
using_namespaces = []
sys_includes = ["selene/runtime.h"]
includes = []
no_includes = false
# cpp_compat = true
after_includes = """
/* Operational calls may overlap when the chosen runtime supports concurrent
 * entry. API 0.3.x runtimes remain restricted to their initialising thread.
 * The host must stop and join program threads before shot_start, shot_end or
 * exit, and must keep the instance alive until every operational call returns.
 * Output records and random-number operations are synchronised independently.
 * An endpoint borrow callback runs on its execution thread and must not
 * re-enter the same runtime or retain the borrowed endpoint. */
"""




############################ Code Style Options ################################

braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF" # also "CR", "CRLF", "Native"




############################# Codegen Options ##################################

style = "both"
sort_by = "Name" # default for `fn.sort_by` and `const.sort_by`
usize_is_size_t = true



[defines]
# "target_os = freebsd" = "DEFINE_FREEBSD"
# "feature = serde" = "DEFINE_SERDE"



[export]
include = []
exclude = ["EndpointBorrowRequest", "EndpointBorrowCallback", "QuantumEndpointHandle", "QuantumEndpointOperationInterface"]
# prefix = "CAPI_"
item_types = []
renaming_overrides_prefixing = false



[export.rename]
EndpointBorrowRequest = "SeleneEndpointBorrowRequest"
EndpointBorrowCallback = "SeleneEndpointBorrowCallback"
QuantumEndpointHandle = "SeleneQuantumEndpoint"
VoidResult = "selene_void_result_t"
BoolResult = "selene_bool_result_t"
U64Result = "selene_u64_result_t"
U32Result = "selene_u32_result_t"
F64Result = "selene_f64_result_t"
WrappedString = "selene_string_t"
FutureResult = "selene_future_result_t"


[export.body]


[export.mangle]
rename_types = "SnakeCase"


[fn]
rename_args = "None"
# must_use = "MUST_USE_FUNC"
# deprecated = "DEPRECATED_FUNC"
# deprecated_with_note = "DEPRECATED_FUNC_WITH_NOTE"
# no_return = "NO_RETURN"
# prefix = "START_FUNC"
# postfix = "END_FUNC"
args = "auto"
sort_by = "Name"




[struct]
rename_fields = "None"
# must_use = "MUST_USE_STRUCT"
# deprecated = "DEPRECATED_STRUCT"
# deprecated_with_note = "DEPRECATED_STRUCT_WITH_NOTE"
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false




[enum]
rename_variants = "None"
# must_use = "MUST_USE_ENUM"
# deprecated = "DEPRECATED_ENUM"
# deprecated_with_note = "DEPRECATED_ENUM_WITH_NOTE"
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
# cast_assert_name = "ASSERT"
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true
private_default_tagged_enum_constructor = false




[const]
allow_static_const = true
allow_constexpr = false
sort_by = "Name"




[macro_expansion]
bitflags = false






############## Options for How Your Rust library Should Be Parsed ##############

[parse]
parse_deps = true
include = ["selene-core"]
# include = []
exclude = []
clean = false
extra_bindings = []



[parse.expand]
crates = []
all_features = false
default_features = true
features = []
