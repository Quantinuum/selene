language = "C"

include_version = false
include_guard = "SELENE_RUNTIME_H"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
includes = ["selene/core_types.h"]
no_includes = false
cpp_compat = true
after_includes = """
/**
 * A runtime plugin must export either this descriptor symbol or the accessor below.
 * The accessor form is recommended for portable C and C++ plugins.
 */
struct SeleneRuntimePluginDescriptorV1;
#ifdef __cplusplus
extern "C" {
#endif
extern const struct SeleneRuntimePluginDescriptorV1 selene_runtime_plugin_descriptor_v1;
const struct SeleneRuntimePluginDescriptorV1 *selene_runtime_get_plugin_descriptor_v1(void);
#ifdef __cplusplus
}
#endif
"""
braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF"
style = "both"
sort_by = "None"
usize_is_size_t = true

[export]
include = [
  "RuntimeAPIVersion",
  "RUNTIME_CURRENT_API_VERSION",
  "RuntimeGetOperationHandle",
  "RuntimeGetOperationInterface",
  "RuntimeGetOperationInstance",
  "RuntimeExtractOperationHandle",
  "RuntimeExtractOperationInterface",
  "RuntimeExtractOperationInstance",
  "RuntimePluginDescriptorV1",
]
exclude = [
  "CURRENT_API_VERSION",
  "SIMULATOR_CURRENT_API_VERSION",
  "ERROR_MODEL_CURRENT_API_VERSION",
  "Errno",
  "ErrorModelAPIVersion",
]
item_types = ["constants", "functions", "structs", "opaque", "enums", "typedefs"]
renaming_overrides_prefixing = false

[export.rename]
"RuntimeAPIVersion" = "SeleneRuntimeAPIVersion"
"RuntimeGetOperationInterface" = "SeleneRuntimeGetOperationInterface"
"RuntimeGetOperationInstance" = "SeleneRuntimeGetOperationInstance"
"RuntimeExtractOperationInterface" = "SeleneRuntimeExtractOperationInterface"
"RuntimeExtractOperationInstance" = "SeleneRuntimeExtractOperationInstance"
"RuntimePluginDescriptorV1" = "SeleneRuntimePluginDescriptorV1"
"Errno" = "SeleneErrno"
"RUNTIME_CURRENT_API_VERSION" = "SELENE_RUNTIME_CURRENT_API_VERSION"

[export.mangle]
rename_types = "SnakeCase"

[fn]
rename_args = "None"
args = "vertical"

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true
private_default_tagged_enum_constructor = false

[const]
allow_static_const = true
allow_constexpr = false
