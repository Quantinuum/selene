language = "C"

include_version = false
include_guard = "SELENE_SIMULATOR_H"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
includes = ["selene/core_types.h"]
no_includes = false
cpp_compat = true
after_includes = """
/**
 * A simulator plugin must export either this descriptor symbol or the accessor below.
 * The accessor form is recommended for portable C and C++ plugins.
 */
struct SeleneSimulatorPluginDescriptorV1;
#ifdef __cplusplus
extern "C" {
#endif
extern const struct SeleneSimulatorPluginDescriptorV1 selene_simulator_plugin_descriptor_v1;
const struct SeleneSimulatorPluginDescriptorV1 *selene_simulator_get_plugin_descriptor_v1(void);
#ifdef __cplusplus
}
#endif
"""
braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF"
style = "both"
sort_by = "None"
usize_is_size_t = true

[export]
include = [
  "SimulatorAPIVersion",
  "SIMULATOR_CURRENT_API_VERSION",
  "SimulatorInstance",
  "SimulatorPluginDescriptorV1",
]
exclude = [
  "CURRENT_API_VERSION",
  "RUNTIME_CURRENT_API_VERSION",
  "ERROR_MODEL_CURRENT_API_VERSION",
  "Errno",
  "ErrorModelAPIVersion",
]
item_types = ["constants", "functions", "structs", "opaque", "enums", "typedefs"]
renaming_overrides_prefixing = false

[export.rename]
"SimulatorAPIVersion" = "SeleneSimulatorAPIVersion"
"SimulatorInstance" = "SeleneSimulatorInstance"
"SimulatorPluginDescriptorV1" = "SeleneSimulatorPluginDescriptorV1"
"Errno" = "SeleneErrno"
"SIMULATOR_CURRENT_API_VERSION" = "SELENE_SIMULATOR_CURRENT_API_VERSION"

[export.mangle]
rename_types = "SnakeCase"

[fn]
rename_args = "None"
args = "vertical"

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true
private_default_tagged_enum_constructor = false

[const]
allow_static_const = true
allow_constexpr = false
