language = "C"

include_version = false
includes = ["selene/core_types.h"]
no_includes = false
cpp_compat = true
after_includes = "#define SELENE_ERROR_MODEL_CURRENT_API_VERSION 0x00000200ULL"
braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF"
style = "both"
sort_by = "None"
usize_is_size_t = true

[export]
include = [
  "ErrorModelAPIVersion",
  "ErrorModelInstance",
  "OperationResultInterface",
  "OperationResultInstance",
  "ErrorModelPluginDescriptorV1",
  "RuntimeGetOperationInstance",
  "RuntimeExtractOperationInterface",
  "RuntimeExtractOperationInstance",
  "SimulatorInstance",
  "SimulatorOperationInterface",
  "Errno",
]
exclude = [
  "CURRENT_API_VERSION",
  "GwStatus",
  "GW_STATUS_OK",
  "GW_STATUS_NULL_POINTER",
  "GW_STATUS_INVALID_ARGUMENT",
  "GW_STATUS_DUPLICATE_GATE",
  "GW_STATUS_NOT_FOUND",
  "GW_STATUS_BUFFER_TOO_SMALL",
  "GW_STATUS_DECODE_ERROR",
  "GW_STATUS_VALIDATION_ERROR",
  "GW_STATUS_PANIC",
  "GW_OPERAND_KIND_QUBIT",
  "GW_OPERAND_KIND_F64",
  "GW_OPERAND_KIND_U64",
  "GW_OPERAND_KIND_I64",
  "GW_OPERAND_KIND_U8",
  "GW_OPERAND_KIND_BOOL",
  "GwSemanticId",
  "GwGateSet",
  "GwOperandDeclView",
  "GwGateDeclView",
  "GwGateDeclInfo",
  "GwOperandDeclInfo",
  "GwGateValueData",
  "GwGateValue",
  "GwGateInstanceView",
  "GwDecodedGate",
  "gw_status_message",
  "gw_semantic_id_from_text",
  "gw_semantic_id_eq",
  "gw_builtin_rz_semantic_id",
  "gw_builtin_phased_x_semantic_id",
  "gw_builtin_zz_phase_semantic_id",
  "gw_builtin_phased_xx_semantic_id",
  "gw_gateset_new",
  "gw_builtin_gateset_new",
  "gw_gateset_free",
  "gw_gateset_add_decl",
  "gw_gateset_add_builtin_rz",
  "gw_gateset_add_builtin_phased_x",
  "gw_gateset_add_builtin_zz_phase",
  "gw_gateset_add_builtin_phased_xx",
  "gw_gateset_len",
  "gw_gateset_contains",
  "gw_gateset_decl_at",
  "gw_gateset_decl_operand_at",
  "gw_gateset_serialized_len",
  "gw_gateset_serialize",
  "gw_gateset_deserialize",
  "gw_gate_serialized_len",
  "gw_gate_serialize",
  "gw_gate_deserialize",
  "gw_decoded_gate_free",
  "gw_decoded_gate_semantic_id",
  "gw_decoded_gate_value_count",
  "gw_decoded_gate_value_at",
  "gw_gateset_validate_decoded",
]
item_types = ["functions", "structs", "opaque", "enums", "typedefs"]
renaming_overrides_prefixing = false

[export.rename]
"ErrorModelAPIVersion" = "SeleneErrorModelAPIVersion"
"ErrorModelInstance" = "SeleneErrorModelInstance"
"OperationResultInterface" = "SeleneOperationResultInterface"
"OperationResultInstance" = "SeleneOperationResultInstance"
"ErrorModelPluginDescriptorV1" = "SeleneErrorModelPluginDescriptorV1"
"RuntimeGetOperationInstance" = "SeleneRuntimeGetOperationInstance"
"RuntimeExtractOperationInterface" = "SeleneRuntimeExtractOperationInterface"
"RuntimeExtractOperationInstance" = "SeleneRuntimeExtractOperationInstance"
"SimulatorInstance" = "SeleneSimulatorInstance"
"Errno" = "SeleneErrno"

[export.mangle]
rename_types = "SnakeCase"

[fn]
rename_args = "None"
args = "vertical"

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true
private_default_tagged_enum_constructor = false

[const]
allow_static_const = true
allow_constexpr = false
