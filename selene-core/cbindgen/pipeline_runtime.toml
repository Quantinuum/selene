language = "C"

include_version = false
include_guard = "SELENE_PIPELINE_RUNTIME_H"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
includes = ["selene/runtime.h"]
no_includes = false
cpp_compat = true
after_includes = """
/**
 * Peripheral runtimes export this descriptor or its getter. API 0.3.x runtimes
 * continue to use selene/runtime.h and are driven by the legacy wrapper.
 */
struct SeleneRuntimePluginDescriptorV2;
#ifdef __cplusplus
extern "C" {
#endif
extern const struct SeleneRuntimePluginDescriptorV2 selene_runtime_plugin_descriptor_v2;
const struct SeleneRuntimePluginDescriptorV2 *selene_runtime_get_plugin_descriptor_v2(void);
#ifdef __cplusplus
}
#endif
"""
braces = "SameLine"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "auto"
documentation_length = "full"
line_endings = "LF"
style = "both"
sort_by = "None"
usize_is_size_t = true

[export]
include = [
  "RuntimeInstructionResultTag", "OutputDatatype",
  "RuntimeInstructionTag", "RuntimeInstructionRaw", "RuntimeInstructionPayload", "RuntimeInstructionResultRaw",
  "PrintRequestRaw", "ExitRequestRaw", "OutputString", "OutputValue", "OutputSinkHandle",
  "RuntimePluginDescriptorV2", "RUNTIME_V2_API_VERSION",
  "QuantumPeripheralHandle", "QuantumPeripheralOperationInterface",
  "PeripheralBorrowRequest", "PeripheralBorrowCallback", "ExecutionCallback",
  "PeripheralResultHandle", "PeripheralResultInterface",
]
exclude = [
  "RuntimeInstruction", "RuntimeInstructionResult", "PrintRequest", "ExitRequest", "PrintValue",
  "CURRENT_API_VERSION", "SIMULATOR_CURRENT_API_VERSION", "ERROR_MODEL_CURRENT_API_VERSION",
  "RUNTIME_CURRENT_API_VERSION", "RuntimeAPIVersion", "Errno", "RuntimeInstance",
  "RuntimeGetOperationHandle", "RuntimeGetOperationInterface", "RuntimeGetOperationInstance",
  "RuntimeExtractOperationHandle", "RuntimeExtractOperationInterface", "RuntimeExtractOperationInstance",
  "ErrorModelSetResultHandle", "ErrorModelSetResultInterface", "ErrorModelSetResultInstance",
]
item_types = ["constants", "structs", "unions", "enums", "typedefs"]

[export.rename]
"RuntimeInstructionResultTag" = "SeleneRuntimeInstructionResultTag"
"OutputDatatype" = "SeleneOutputDatatype"
"QFreeInstruction" = "SeleneQFreeInstruction"
"RXYGateInstruction" = "SeleneRXYGateInstruction"
"RZZGateInstruction" = "SeleneRZZGateInstruction"
"RZGateInstruction" = "SeleneRZGateInstruction"
"RPPGateInstruction" = "SeleneRPPGateInstruction"
"MeasureInstruction" = "SeleneMeasureInstruction"
"MeasureLeakedInstruction" = "SeleneMeasureLeakedInstruction"
"ResetInstruction" = "SeleneResetInstruction"
"ForceResultInstruction" = "SeleneForceResultInstruction"
"GetBoolResultInstruction" = "SeleneGetBoolResultInstruction"
"GetU64ResultInstruction" = "SeleneGetU64ResultInstruction"
"IncrementFutureRefcountInstruction" = "SeleneIncrementFutureRefcountInstruction"
"DecrementFutureRefcountInstruction" = "SeleneDecrementFutureRefcountInstruction"
"LocalBarrierInstruction" = "SeleneLocalBarrierInstruction"
"GlobalBarrierInstruction" = "SeleneGlobalBarrierInstruction"
"CustomCallInstruction" = "SeleneCustomCallInstruction"
"SimulateDelayInstruction" = "SeleneSimulateDelayInstruction"
"RuntimeInstructionRaw" = "SeleneRuntimeInstruction"
"RuntimeInstructionTag" = "SeleneRuntimeInstructionTag"
"RuntimeInstructionResultRaw" = "SeleneRuntimeInstructionResult"
"RuntimeInstructionPayload" = "SeleneRuntimeInstructionPayload"
"PrintRequestRaw" = "SelenePrintRequest"
"ExitRequestRaw" = "SeleneExitRequest"
"OutputString" = "SeleneOutputString"
"OutputValue" = "SeleneOutputValue"
"OutputSinkHandle" = "SeleneOutputSink"
"RuntimePluginDescriptorV2" = "SeleneRuntimePluginDescriptorV2"
"RUNTIME_V2_API_VERSION" = "SELENE_RUNTIME_V2_API_VERSION"
"QuantumPeripheralHandle" = "SeleneQuantumPeripheral"
"QuantumPeripheralOperationInterface" = "SeleneQuantumPeripheralOperationInterface"
"PeripheralBorrowRequest" = "SelenePeripheralBorrowRequest"
"PeripheralBorrowCallback" = "SelenePeripheralBorrowCallback"
"ExecutionCallback" = "SeleneExecutionCallback"
"PeripheralResultHandle" = "SelenePeripheralResultHandle"
"PeripheralResultInterface" = "SelenePeripheralResultInterface"
"RuntimeInstance" = "RuntimeInstance"
"Errno" = "SeleneErrno"
"RuntimeExtractOperationHandle" = "RuntimeExtractOperationHandle"
"ErrorModelSetResultHandle" = "ErrorModelSetResultHandle"

[export.mangle]
rename_types = "SnakeCase"

[fn]
rename_args = "None"
args = "vertical"

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = true
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true
private_default_tagged_enum_constructor = false

[const]
allow_static_const = true
allow_constexpr = false
