[project]
name = "selene-toolchain"
version = "0.1.0"
description = "LLVM tools and executable linking support for Selene"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"

[build-system]
requires = ["hatchling", "packaging", "cmake>=3.21", "ninja"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/selene_toolchain"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = "collect_sources.py" },
  { file = "native/**" },
  { file = "python/**/*.py" },
  { file = "vendor/**" },
  { file = "../hugrenv.lock" },
  { env = "HUGRENV_PATH" },
  { env = "CC" },
  { env = "CXX" },
]

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64"
test-requires = ["pytest", "hatchling", "packaging"]
test-command = 'pytest "{package}/tests"'

[tool.cibuildwheel.linux]
environment-pass = ["HUGRENV_PATH", "SELENE_TOOLCHAIN_SOURCE_DIR"]
before-all = "dnf install -y dnf-plugins-core"
before-build = '''
    set -e
    python "{package}/collect_sources.py"
    # The next cibuildwheel invocation uses a fresh container, so keep the
    # sources on the host for the workflow's runtime-source artifact upload.
    if [ -n "$SELENE_TOOLCHAIN_SOURCE_DIR" ]; then
        mkdir -p "/host$SELENE_TOOLCHAIN_SOURCE_DIR"
        cp "{package}"/source-bundles/* "/host$SELENE_TOOLCHAIN_SOURCE_DIR/"
    fi
'''

[tool.cibuildwheel.linux.environment]
HUGRENV_PATH = "/host$HUGRENV_PATH"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.cibuildwheel.windows.environment]
CC = "$MINGW_ROOT/bin/gcc.exe"
CXX = "$MINGW_ROOT/bin/g++.exe"

[tool.cibuildwheel.windows]
before-build = 'python -m pip install "delvewheel>=1.11,<2"'
repair-wheel-command = 'delvewheel repair --analyze-existing-exes --add-path "%HUGRENV_PATH%/bin;%MINGW_ROOT%/bin" -w {dest_dir} {wheel}'
